<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="VoiceScribe logo">
  <defs>
    <linearGradient id="vs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#vs-bg)"/>
  <!-- waveform bars -->
  <g fill="#ffffff">
    <rect x="30" y="52" width="8" height="24" rx="4"/>
    <rect x="42" y="40" width="8" height="48" rx="4"/>
    <rect x="54" y="30" width="8" height="68" rx="4"/>
    <rect x="66" y="44" width="8" height="40" rx="4"/>
    <rect x="78" y="54" width="8" height="20" rx="4"/>
  </g>
  <!-- subtitle caption lines -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="30" y="90" width="56" height="6" rx="3"/>
    <rect x="38" y="100" width="40" height="6" rx="3"/>
  </g>
</svg>
